submission:
  title: "ReadyLine — Mission Readiness & Predictive Maintenance Copilot"
  problem_statement: >
    Military organisations cannot reliably tell whether aircraft, vehicles, and equipment
    are mission-ready. Maintenance still runs on fixed calendar schedules regardless of
    actual component condition, while HUMS (Health & Usage Monitoring System) sensor data
    that could predict failures weeks in advance sits unanalysed. When platforms fail
    unexpectedly, operational readiness drops and recovery takes weeks. The US military
    spends $90B/year on maintenance — shifting to predictive approaches saves billions.
  solution_summary: >
    ReadyLine ingests HUMS sensor data and service records for a fleet of assets, computes
    a per-asset mission-readiness score, explains exactly which components are driving
    each readiness issue, extrapolates sensor trends to predict which components will
    fail before the next mission window, and generates a prioritised maintenance plan so
    commanders and maintenance crews know what to fix first and why.
  key_features:
    - "Fleet-wide readiness dashboard scored Ready / At Risk / Not Ready per asset"
    - "Per-component root-cause explanation of every readiness issue (which sensor, how far past threshold)"
    - "Trend-based failure prediction with estimated days-to-failure per component"
    - "Auto-generated, priority-ranked maintenance plan across the whole fleet"
    - "IBM Bob used to scaffold the analysis pipeline, generate the architecture diagram, and review the readiness-scoring logic"
